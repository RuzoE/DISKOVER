# Orquestación de DSLE para un despliegue de un solo host (o para levantar la
# pila completa en local con la imagen de producción). Ver ADR-0016 y
# docs/fases/FASE-13-devops.md.
#
# Antes de `docker compose up -d`:
#   cp .env.production.example .env    # y rellena APP_KEY y las contraseñas
#
# El scheduler ejecuta `schedule:run` cada minuto (incluye dsle:backup diario).

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: dsle:latest
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - storage-data:/var/www/html/storage/app
    - backups-data:/var/www/html/storage/app/backups

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app

  web:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports:
      - "${DSLE_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app
    environment:
      CONTAINER_ROLE: scheduler
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"

  queue:
    <<: *app
    environment:
      CONTAINER_ROLE: queue
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=3 --no-interaction

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-diskover}"
      MYSQL_USER: "${DB_USERNAME:-diskover}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  storage-data:
  backups-data:

; Worker de la cola de DSLE gestionado por Supervisor.
;
; Copia a /etc/supervisor/conf.d/dsle-worker.conf y ajusta las rutas y el
; usuario. Luego:
;
;   supervisorctl reread && supervisorctl update && supervisorctl start dsle-worker:*

[program:dsle-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/dsle/artisan queue:work --tries=3 --max-time=3600 --sleep=3
directory=/var/www/dsle
autostart=true
autorestart=true
stopwaitsecs=3600
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/dsle/worker.log
stopasgroup=true
killasgroup=true
